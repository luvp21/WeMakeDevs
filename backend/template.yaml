AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Vaani backend — repo ingest, script gen, script lock, Polly Kajal narration, Fargate render, recording upload, Transcribe (stages 1-3, 5, 6, fallback narration, render)

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Google AI Studio API key used by script generation (pass with --parameter-overrides GeminiApiKey=...)
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Groq API key used by the Whisper STT path (pass with --parameter-overrides GroqApiKey=...); only required when STT_PROVIDER=groq
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the render Fargate task launches into (default VPC is fine for this)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the render Fargate task (assignPublicIp is used, so no NAT gateway needed)

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        S3_BUCKET: !Ref VaaniBucket

Resources:
  VaaniBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "vaani-ai-${AWS::AccountId}-${AWS::Region}"
      CorsConfiguration:
        # Needed so the browser can PUT recordings directly to S3 via a
        # presigned URL (bypasses Lambda/API Gateway payload limits, which a
        # multi-minute scene recording would otherwise exceed).
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT]
            AllowedHeaders: ["*"]

  VaaniHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "OPTIONS"]
        AllowHeaders: ["content-type"]

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ingest.handler
      CodeUri: src
      Environment:
        Variables:
          GITHUB_TOKEN: ""
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        Ingest:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /ingest
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/ingest.ts

  ScriptGenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scriptGen.handler
      CodeUri: src
      Timeout: 120
      Environment:
        Variables:
          LLM_PROVIDER: "gemini"
          GEMINI_API_KEY: !Ref GeminiApiKey
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        ScriptGen:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /script
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/scriptGen.ts

  ScriptPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scriptSteps.planHandler
      CodeUri: src
      Timeout: 60
      Environment:
        Variables:
          LLM_PROVIDER: "gemini"
          GEMINI_API_KEY: !Ref GeminiApiKey
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /script/plan
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/scriptSteps.ts

  WriteSceneFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scriptSteps.writeSceneHandler
      CodeUri: src
      Timeout: 60
      Environment:
        Variables:
          LLM_PROVIDER: "gemini"
          GEMINI_API_KEY: !Ref GeminiApiKey
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /script/write-scene
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/scriptSteps.ts

  SceneGenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sceneGen.handler
      CodeUri: src
      Timeout: 60
      Environment:
        Variables:
          LLM_PROVIDER: "gemini"
          GEMINI_API_KEY: !Ref GeminiApiKey
      Events:
        SceneGen:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /script/scene
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/sceneGen.ts

  LockScriptFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lockScript.handler
      CodeUri: src
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        LockScript:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /script/lock
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/lockScript.ts

  NarrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: narrate.handler
      CodeUri: src
      Timeout: 120
      Environment:
        Variables:
          POLLY_ENGINE: "neural"
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
      Events:
        Narrate:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /narrate
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/narrate.ts

  # --- Render stage (stage 8) — Fargate, never Lambda, see CLAUDE.md #6 ---
  # One-off task per render (not a long-running ECS service), so cost is
  # only incurred for actual render runtime, not idle capacity.

  RenderRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vaani-render

  RenderCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: vaani-render-cluster

  RenderSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Vaani render Fargate task - outbound only, nothing inbound
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  RenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /vaani/render
      RetentionInDays: 7

  RenderTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  RenderTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RenderS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${VaaniBucket.Arn}/*"

  RenderTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vaani-render
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "2048"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt RenderTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt RenderTaskRole.Arn
      ContainerDefinitions:
        - Name: render
          Image: !Sub "${RenderRepository.RepositoryUri}:latest"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RenderLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: render

  RenderTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: render.handler
      CodeUri: src
      Environment:
        Variables:
          ECS_CLUSTER: !Ref RenderCluster
          ECS_TASK_DEFINITION: !Ref RenderTaskDefinition
          ECS_SUBNETS: !Join [",", !Ref SubnetIds]
          ECS_SECURITY_GROUP: !Ref RenderSecurityGroup
          ECS_CONTAINER_NAME: render
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
        - Statement:
            - Effect: Allow
              Action: ecs:RunTask
              Resource: !Ref RenderTaskDefinition
            - Effect: Allow
              Action: iam:PassRole
              Resource:
                - !GetAtt RenderTaskExecutionRole.Arn
                - !GetAtt RenderTaskRole.Arn
      Events:
        Render:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /render
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/render.ts

  RenderStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: renderStatus.handler
      CodeUri: src
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        RenderStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /render/{scriptId}/status
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/renderStatus.ts

  RecordingUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: recordingUploadUrl.handler
      CodeUri: src
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        RecordingUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /recording/upload-url
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/recordingUploadUrl.ts

  TranscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: transcribe.handler
      CodeUri: src
      Timeout: 60
      Environment:
        Variables:
          STT_PROVIDER: "groq"
          GROQ_API_KEY: !Ref GroqApiKey
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:DeleteTranscriptionJob
              Resource: !Sub "arn:aws:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/vaani-*"
      Events:
        Transcribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /transcribe
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/transcribe.ts

  TranscribeStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: transcribeStatus.handler
      CodeUri: src
      Environment:
        Variables:
          STT_PROVIDER: "groq"
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
        - Statement:
            - Effect: Allow
              Action: transcribe:GetTranscriptionJob
              Resource: !Sub "arn:aws:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/vaani-*"
      Events:
        TranscribeStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /transcribe/{scriptId}/{sceneId}/status
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/transcribeStatus.ts

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sync.handler
      CodeUri: src
      Environment:
        Variables:
          STT_PROVIDER: "groq"
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
        - Statement:
            - Effect: Allow
              Action: transcribe:GetTranscriptionJob
              Resource: !Sub "arn:aws:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/vaani-*"
      Events:
        Sync:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /sync
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/sync.ts

  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: projects.listHandler
      CodeUri: src
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        ListProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /projects
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/projects.ts

  ProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: projects.getHandler
      CodeUri: src
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        GetProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /projects/{scriptId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/projects.ts

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub "https://${VaaniHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Value: !Ref VaaniBucket
  RenderRepositoryUri:
    Description: Push the render container image here before the render step will work
    Value: !GetAtt RenderRepository.RepositoryUri
